[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oraculo"
version = "0.1.0"
description = "O.R.A.C.U.L.O. — previsão de carga e risco de curtailment no SIN (Hackathon IA COPPE/UFRJ 2026)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "pandas",
    "pyarrow",
    "duckdb",
    "geopandas",
    "matplotlib",
    "seaborn",
    "lightgbm",
    "pytorch-forecasting",
    "pyyaml",
    "jsonschema",
    "requests",
    "holidays",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "nbconvert", "ipykernel"]
era5 = ["cdsapi", "xarray", "netcdf4"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
