# Fontes do ONS baixadas por src/ingestion/download.py.
# Os arquivos de cada conjunto NÃO são listados aqui: o script consulta a API CKAN do
# portal (package_show) e pega todos os recursos PARQUET. Assim novos meses entram sozinhos.

ckan_package_show: https://dados.ons.org.br/api/3/action/package_show
destino: data/raw/ons              # relativo à raiz do repositório
threads_download: 6
timeout_s: 300

# Limites do DuckDB na consolidação por id_ons (máquina com pouca RAM e disco quase cheio)
duckdb:
  memory_limit: 2GB
  threads: 2
  max_temp_directory_size: 6GB   # rótulos (ORDER BY + janela em 16M linhas) precisam de >1GB; 6GB ainda deixa o disco seguro
  # Valores baixos aqui fragmentam a escrita (1 arquivo por flush). A memória da
  # consolidação é controlada por grupos_consolidacao, não por estes buffers.
  partitioned_write_max_open_files: 128
  partitioned_write_flush_threshold: 524288
  grupos_consolidacao: 16    # id_ons divididos em N grupos ordenados (~5M linhas cada)

# Divergência "grande" na sanidade = razão linhas_obtidas/linhas_esperadas fora deste intervalo
sanidade_razao_min: 0.5
sanidade_razao_max: 2.0

# particao:
#   data     -> ano=YYYY/mes=MM a partir do nome do arquivo (bases tm e séries mensais)
#   id_ons   -> baixa mensal em _landing/ e consolida em ano=<AAAA>/id_ons=<id>/ com DuckDB (bases detail;
#               atualizar um mês só reescreve o ano dele)
#   arquivo  -> guarda o arquivo como veio (séries pequenas / cadastros)
conjuntos:
  - pacote: restricao_coff_eolica_usi
    apelido: coff_eolica_tm
    particao: data
    linhas_esperadas: 8000000
  - pacote: restricao_coff_fotovoltaica
    apelido: coff_solar_tm
    particao: data
    linhas_esperadas: 2900000
  - pacote: restricao_coff_eolica_detail
    apelido: coff_eolica_detail
    particao: id_ons
    linhas_esperadas: 63000000
  - pacote: restricao_coff_fotovoltaica_detail
    apelido: coff_solar_detail
    particao: id_ons
    linhas_esperadas: 19000000
  - pacote: geracao-termica-despacho-2
    apelido: termica_despacho
    particao: data
  - pacote: intercambio-nacional
    apelido: intercambio_nacional
    particao: data
    aceitar_csv: true        # Parquet só existe de 2023 em diante; antes disso só CSV
  - pacote: fator-capacidade-2
    apelido: fator_capacidade
    particao: data
  - pacote: balanco-energia-subsistema
    apelido: balanco_subsistema
    particao: data
  - pacote: curva-carga
    apelido: curva_carga
    particao: data
  - pacote: capacidade-geracao
    apelido: capacidade_geracao
    particao: arquivo
  - pacote: usina_conjunto
    apelido: usina_conjunto
    particao: arquivo
  - pacote: modalidade-usina
    apelido: modalidade_usina
    particao: arquivo

# Arquivos únicos fora do portal ONS (baixados com o mesmo manifesto e a mesma trava).
arquivos_diretos:
  # Relação de empreendimentos de MMGD (ANEEL): potência instalada por distribuidora,
  # município e data de conexão. É a única fonte de CAPACIDADE de MMGD (o ONS só publica
  # a geração estimada). Atualizada diariamente pela ANEEL.
  - apelido: aneel_mmgd_empreendimentos
    url: https://dadosabertos.aneel.gov.br/dataset/5e0fafd2-21b9-4d5b-b622-40438d40aba2/resource/cd29f6eb-e08d-4db7-b6fb-ed6e3b682d27/download/empreendimento-geracao-distribuida.parquet
    destino: data/raw/aneel/empreendimento_geracao_distribuida.parquet
    # A ANEEL atualiza todo dia; rebaixar semanalmente basta para a escala do hackathon
    # (~100 MB por download). Sem esta chave, um arquivo direto nunca expira.
    atualizar_apos_dias: 7
  # SIGA (ANEEL): empreendimentos de geração com CEG e COORDENADAS. Dá a posição real de cada
  # usina/conjunto no Mapa Híbrido (via CEG dos membros do conjunto, cadastro usina_conjunto do
  # ONS). CSV ';' com decimal em vírgula: vira Parquet (tudo texto) na chegada. ~8 MB.
  - apelido: aneel_siga_empreendimentos
    url: https://dadosabertos.aneel.gov.br/dataset/6d90b77c-c5f5-4d81-bdec-7bc619494bb9/resource/11ec447d-698d-4ab8-977f-b424d5deee6a/download/siga-empreendimentos-geracao.csv
    destino: data/raw/aneel/siga_empreendimentos_geracao.csv
    atualizar_apos_dias: 7
  # CTR - Curva de Carga Consumidor Tipo (ANEEL): curvas de demanda de 15 min MEDIDAS nas
  # campanhas das revisões tarifárias periódicas, por distribuidora, subgrupo tarifário (B1
  # residencial, B2 rural, B3 demais BT, A4 MT, A2/A3 AT) e tipo de dia. É a forma horária real
  # de cada classe na página Classes de consumo (oraculo/profiles/medidos.py); substitui os
  # perfis estilizados. ~41 MB. A ANEEL republica mensalmente.
  - apelido: aneel_ctr_consumidor_tipo
    url: https://dadosabertos.aneel.gov.br/dataset/2594ebad-1306-49d1-9f30-ded144acca87/resource/fae0d52c-5f02-4e84-a11b-d03db87e990d/download/ctr-curvas-carga-consumidor-tipo.parquet
    destino: data/raw/aneel/ctr_curvas_carga_consumidor_tipo.parquet
    atualizar_apos_dias: 30
  # Malha dos municípios (IBGE, API de malhas v3, qualidade mínima, ~3,6 MB): ponto
  # representativo de cada município para a densidade de MMGD. GeoJSON vira GeoParquet na chegada.
  - apelido: ibge_malha_municipios
    url: https://servicodados.ibge.gov.br/api/v3/malhas/paises/BR?formato=application/vnd.geo+json&qualidade=minima&intrarregiao=municipio
    destino: data/raw/ibge/malha_municipios.geojson
    atualizar_apos_dias: 180

  # BDGD (Base de Dados Geográfica da Distribuidora, ANEEL) da área piloto RJ (decisão do Tiago
  # em 2026-09-26: RJ reaproveitando a pipeline do Backend/RDX). Uma File Geodatabase zipada por
  # distribuidora, publicada uma vez por ano no portal ArcGIS da ANEEL (dono: aneel_aneel).
  # Para trocar de ano: pegue o id do item em
  #   https://www.arcgis.com/sharing/rest/search?q=title:Light_382&f=json
  # e troque `url` E `destino` (o download percebe a URL nova e rebaixa; ver download.py).
  # Sem `atualizar_apos_dias`: a base é anual, nunca expira sozinha.
  # Lido direto do .zip pelo GDAL (/vsizip/), sem descompactar: o disco da máquina é apertado.
  - apelido: bdgd_light
    url: https://www.arcgis.com/sharing/rest/content/items/430f90486174407aabe3b07f50ca6150/data
    destino: data/raw/aneel/bdgd/Light_382_2025-12-31_V11_20260824-0926.gdb.zip   # ~1,1 GB
  - apelido: bdgd_enel_rj
    url: https://www.arcgis.com/sharing/rest/content/items/32a52a0b29df4b82b9e63362bc927267/data
    destino: data/raw/aneel/bdgd/Enel_RJ_383_2025-12-31_V11_20260827-0133.gdb.zip  # ~1,0 GB

  # Malhas do IBGE (API de malhas v3): limite do estado do RJ (preenche os vazios entre as
  # manchas, como o RDX fazia com o geobr) e municípios do RJ (rateio do cadastro da ANEEL por
  # mancha). Substitui o pacote geobr: é a mesma malha oficial, sem dependência nova.
  - apelido: ibge_malha_rj
    url: https://servicodados.ibge.gov.br/api/v3/malhas/estados/33?formato=application/vnd.geo+json&qualidade=maxima
    destino: data/raw/ibge/malha_uf_33.geojson
  - apelido: ibge_malha_municipios_rj
    url: https://servicodados.ibge.gov.br/api/v3/malhas/estados/33?formato=application/vnd.geo+json&qualidade=maxima&intrarregiao=municipio
    destino: data/raw/ibge/malha_municipios_33.geojson

# API REST de carga (fora do CKAN e fora do MCP). Limite: 3 meses por chamada.
api_carga:
  base_url: https://apicarga.ons.org.br/prd
  threads: 4
  janela_meses: 3
  # dados de uma janela só são considerados "fechados" (não rebaixar) se ela terminou
  # há mais que isto; janelas recentes são rebaixadas porque o ONS ainda consiste os dados.
  dias_para_fechar: 45
  endpoints:
    - nome: cargaverificada
      apelido: carga_verificada
      inicio: "2016-01-01"
      areas: [SECO, S, NE, N, RJ, SP, MG, ES, MT, MS, DF, GO, AC, RO, PR, SC, RS,
              BASE, BAOE, ALPE, PBRN, CE, PI, TON, PA, MA, AP, AM, RR,
              PESE, PES, PENE, PEN]   # perdas: fecham a soma áreas -> subsistema
    - nome: cargaprogramada
      apelido: carga_programada
      inicio: "2021-03-05"
      areas: [SECO, S, NE, N]

# Tempo (Open-Meteo, modelo ECMWF IFS 0,25°): radiação, vento, temperatura e nuvens nas sedes
# das UFs (coordenadas de config/publicacao.yaml: posicao_uf, sem cópia). Decisão do Tiago em
# 2026-09-26: só para os fatores climáticos EXIBIDOS na curva de previsão (tela Despacho
# Preditivo); NÃO é feature de nenhum modelo. Janela baixada depende do "agora" da publicação:
#   agora = ultimo_dado -> API de previsão: `dias_passados` para trás e `dias_futuros` à frente
#                          de hoje; rebaixada a cada execução (a previsão muda);
#   agora = data fixa   -> API de previsões ARQUIVADAS (historical forecast) de agora − 1 dia a
#                          agora + 2 dias; não expira (o passado não muda).
# Uma requisição só (as 27 coordenadas juntas, ~100 kB). JSON vira Parquet na chegada.
open_meteo:
  apelido: open_meteo_clima
  url_previsao: https://api.open-meteo.com/v1/forecast
  url_historica: https://historical-forecast-api.open-meteo.com/v1/forecast
  modelo: ecmwf_ifs025
  variaveis: [shortwave_radiation, wind_speed_10m, temperature_2m, cloud_cover]
  dias_passados: 7
  dias_futuros: 3
  destino: data/raw/open_meteo/clima_uf.parquet
