# Etapa 5 do run_heavywork.py (publicação no banco). Ver docs/Oraculo_planejamento.md §13.1.

# O "agora" da publicação (modo replay).
#   ultimo_dado  -> última semi-hora com carga global e MMGD dos 4 subsistemas (decisão do
#                   Tiago em 2026-09-25, enquanto a janela da demo não é definida)
#   ISO-8601 com fuso, ex. "2025-08-10T13:00:00-03:00" -> última semi-hora completa até ele
agora: ultimo_dado

# Cópia do JSON publicado, para inspeção e exportação (a mesma função monta o banco e o arquivo).
arquivo_export: output/contrato.json

# Tela Validação: fontes exibidas (rótulo -> conjuntos do manifesto de download). Todo apelido
# de config/fontes_ons.yaml precisa estar em exatamente um grupo, e só eles: o run_heavywork.py
# confere isso ANTES da primeira etapa (download.validar_grupos_fontes) e o teste
# test_status_fontes_cobre_todas_as_fontes_declaradas também. Fonte nunca some da tela.
# Só entram fontes que o projeto de fato ingere (ERA5 e satélite ainda não).
status_fontes:
  "ONS — API de Carga Verificada": [carga_verificada, carga_programada]
  "ONS — Dados Abertos (constrained-off)": [coff_eolica_tm, coff_solar_tm, coff_eolica_detail, coff_solar_detail]
  "ONS — Dados Abertos (operação e cadastro)": [termica_despacho, intercambio_nacional, fator_capacidade,
                                                balanco_subsistema, curva_carga, capacidade_geracao,
                                                usina_conjunto, modalidade_usina]
  "ANEEL — Cadastro de MMGD": [aneel_mmgd_empreendimentos]
  "ANEEL — SIGA (empreendimentos de geração)": [aneel_siga_empreendimentos]
  "IBGE — Malha municipal": [ibge_malha_municipios]

